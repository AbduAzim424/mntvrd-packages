schema: 1
name: glibc
version: "2.43"
revision: 1
description: "The GNU C Library"
license: LGPL-2.1-or-later

source:
  - uri: https://ftpmirror.gnu.org/glibc/glibc-2.43.tar.xz
    sha256: d9c86c6b5dbddb43a3e08270c5844fc5177d19442cf5b8df4be7c07cd5fa3831
    strip_components: 1
  - uri: https://www.linuxfromscratch.org/patches/lfs/development/glibc-fhs-1.patch
    sha256: 643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d
    extract: false

build:
  environment:
    packages:
      - pkg:bbi
      - pkg:texinfo  # glibc ships .info docs; needed for install-info during make install
      - pkg:python   # glibc 2.40+ requires python for build scripts (gen-as-const.py etc.)
      - pkg:bison
      - pkg:m4   # bison requires m4 to generate plural.c
      - pkg:gzip # localedata make install compresses charmaps with gzip

  pipeline:
    - uses: fetch
      with:
        uri: ${{source[0].uri}}

    - uses: fetch
      with:
        uri: ${{source[1].uri}}

    - uses: patch
      with:
        file: glibc-fhs-1.patch
        strip: "1"

    - runs: |
        mkdir -v build
        cd build

        # Ensure ldconfig and sln land in /usr/sbin (not /sbin)
        echo "rootsbindir=/usr/sbin" > configparms

        ../configure \
            --prefix=/usr                    \
            --disable-werror                 \
            --disable-nscd                   \
            --enable-kernel=5.4              \
            --enable-stack-protector=strong  \
            libc_cv_slibdir=/usr/lib

        make -j$(nproc)

install:
  pipeline:
    - runs: |
        # Skip the outdated test-installation sanity check
        sed '/test-installation/s@$(PERL)@echo not running@' -i build/Makefile

    - uses: make-install
      with:
        opts: "-C build"

    - runs: |
        # Fix hardcoded /usr prefix in ldd's RTLDLIST
        sed '/RTLDLIST=/s@/usr@@g' -i ${{targets.destdir}}/usr/bin/ldd

        # ld.so.cache is regenerated by the ldconfig trigger on every install;
        # shipping a stale cache file in the package is wrong.
        rm -f ${{targets.destdir}}/etc/ld.so.cache

        # Remove info dir file (must be generated by install-info trigger)
        rm -f ${{targets.destdir}}/usr/share/info/dir

package:
  depends:
    - pkg:monteverde-baselayout
  triggers:
    - ldconfig
    - install-info
  priority: 10

subpackages:
  # Development files: headers, static libs, crt objects, linker scripts.
  # Anything a compiler needs to build against glibc but that a running
  # system does not need.
  - name: glibc-dev
    description: "The GNU C Library headers, static libraries and linker scripts"
    install:
      pipeline:
        - runs: |
            md=${{targets.main_destdir}}
            dd=${{targets.destdir}}
            mkdir -p "$dd/usr/lib"

            mv "$md/usr/include" "$dd/usr/include"

            # Static libraries and crt startup objects
            find "$md/usr/lib" -maxdepth 1 \( -name '*.a' -o -name '*.o' \) \
                -exec mv {} "$dd/usr/lib/" \;

            # Unversioned .so linker scripts - ld(1) resolves these at link
            # time; the dynamic linker uses the versioned .so.X names at
            # runtime and does not need these.
            for f in libc.so libm.so libresolv.so libanl.so libmvec.so \
                      libBrokenLocale.so libthread_db.so \
                      libnss_compat.so libnss_db.so libnss_hesiod.so; do
              if [ -e "$md/usr/lib/$f" ]; then mv "$md/usr/lib/$f" "$dd/usr/lib/$f"; fi
            done
    package:
      depends:
        - pkg:glibc=${{package.full_version}}

  # iconv character-set conversion modules.  Large (hundreds of .so files)
  # and only needed when converting between obscure encodings.  UTF-8 native
  # systems can omit this entirely.
  - name: glibc-iconv
    description: "The GNU C Library iconv character set conversion modules"
    install:
      pipeline:
        - runs: |
            mkdir -p ${{targets.destdir}}/usr/lib
            mv ${{targets.main_destdir}}/usr/lib/gconv \
               ${{targets.destdir}}/usr/lib/gconv

            mkdir -p ${{targets.destdir}}/usr/sbin
            mv ${{targets.main_destdir}}/usr/sbin/iconvconfig \
               ${{targets.destdir}}/usr/sbin/iconvconfig
    package:
      depends:
        - pkg:glibc=${{package.full_version}}

  # Locale definition source files and charmap data.  Only needed if you
  # want to run localedef(1) to compile new locales from source.  Pre-built
  # locale archives or C.UTF-8 alone are sufficient for most workloads.
  - name: glibc-locales
    description: "The GNU C Library locale definitions, charmaps and message catalogs"
    install:
      pipeline:
        - runs: |
            mkdir -p ${{targets.destdir}}/usr/share
            mv ${{targets.main_destdir}}/usr/share/i18n   \
               ${{targets.destdir}}/usr/share/i18n
            mv ${{targets.main_destdir}}/usr/share/locale \
               ${{targets.destdir}}/usr/share/locale
    package:
      depends:
        - pkg:glibc=${{package.full_version}}
